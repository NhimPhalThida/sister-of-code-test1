<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework1</title>
  <link rel="icon" href="https://i1-e.pinimg.com/1200x/ee/64/34/ee6434369226b21f88ecd614e9480b71.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>  
  
  <header class="main-header">
    <h2>Student Practice Webpage</h2>
    <p>HTML + CSS Practice (Froms + Tables Advanced)</p>
  </header>
 
  <section class="block-1">
      <h3>Image Section</h3>
      <img src="https://i.pinimg.com/1200x/70/16/ce/7016ce1ecf3fdf3451091aba66b451a7.jpg" alt="Section pic">
  </section>

  <section class="block-1">
    <h3>Image Cricle</h3>
    <img src="https://i.pinimg.com/1200x/70/16/ce/7016ce1ecf3fdf3451091aba66b451a7.jpg" alt="Cricle pic" class="cricle-img">
  </section>

  <section class="block-1">
    <h3>Image Oval</h3>
    <img src="https://i.pinimg.com/1200x/70/16/ce/7016ce1ecf3fdf3451091aba66b451a7.jpg" alt="Oval pic" class="oval-img">
  </section>

  <section class="block-1">
    <div>
      <h3>Advanced Tabel</h3>
      <table class="table-stu">
        <thead>
            <tr>
                <th rowspan="2">Name</th>
                <th colspan="2">Scores</th>
                <th rowspan="2">Grade</th>
            </tr>
            <tr>
                <th>Math</th>
                <th>CS</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>90</td>
                <td>95</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>80</td>
                <td>85</td>
                <td>B</td>
            </tr>
        </tbody>
      </div>
    </table>
  </section>

  <section class="block-1">
      <form>
      <div class="form-info">
        <h3>Form 1: Basic Info</h3>
        <label for="name">Name <span class="star">*</span></label>
        <input type="text" id="name">
      </div>  
      <div class="form-info">
        <label for="email">Email <span class="star">*</span></label>
        <input type="email" id="email">
      </div>   
      <div class="form-info">
        <label for="pw">Password <span class="star">*</span></label>
        <input type="password" id="pw">
      </div>
      <div class="form-info">
        <label for="upfile">Update file </label>
        <input type="file" id="upfile">
      </div>
      <div class="form-btt">
        <button type="submit" class="btt">submit</button>
        <button type="reset" class="btt">reset</button>
      </div>    
    </form>
  </section>
   
  <section class="block-1">
    <form>
      <div class="form-info">
        <h3>Form 2: Survey Info</h3>
        <label for="ch-course">Choose Course <span class="star">*</span></label>
        <input type="text" placeholder=" --Seclect-- " id="ch-course">
      </div>
      <div class="form-info ">
        <label>Gender</label>
        <div class="check-box">
          <label>
            <input type="radio" name="gender">
            Male</label>
          <label>
            <input type="radio" name="gender">
            Female</label>
        </div>
      </div>
      <div class="form-info">
        <label for="text">Skills</label>
        <div class="check-box" id="checkb">
          <label>
            <input type="checkbox" name="checkb" >CSS
          </label>
          <label>
            <input type="checkbox" name="checkb" >HTML
          </label>
          <label>
            <input type="checkbox" name="checkb" >JS
          </label>
        </div>
      </div>
      <div class="form-info">
        <label for="ph">Phone <span class="star">*</span></label>
        <textarea type="tel" name="tel" id="ph" cols="30" rows="2"></textarea>
      </div>
      <div class="form-info">
        <label for="sms">Massage</label>
        <textarea name="text" id="sms" cols="30" rows="6"></textarea>
      </div>
      <div class="form-btt ">
        <button type="submit" class="btt">submit</button>
      </div> 
    </form>
  </section>  
</body>
</html>
